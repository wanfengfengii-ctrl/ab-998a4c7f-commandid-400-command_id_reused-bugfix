services:
  api:
    build: .
    image: stowage-pre-review-api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: stowage-pre-review-api
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command: ["sh", "-c", "python -m pytest tests -q && python verify/acceptance.py"]
